[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b1ack-memory"
version = "0.1.7"
description = "A small, transparent personal memory provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
b1ack-memory = "b1ack_memory.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["fastapi>=0.115", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["b1ack_memory*"]

[tool.setuptools.package-data]
b1ack_memory = [
    "plugin.yaml",
    "static/*",
    "dashboard/*.json",
    "dashboard/dist/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
